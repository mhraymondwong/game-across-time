; Web/HTML5 release preset for Godot 4.7.2.
; Export path is build/web/index.html. Commit build/web; GitHub Pages publishes it.
; html/custom_html_shell is export/web_shell.html (diary loading screen).
; html/head_include stays empty. Relative URLs work at /game-across-time/
; because Pages redirects to a trailing slash. Do not add a <base href>.
; Viewport stays 1280x720 from project.godot. Canvas resize policy 2 = Adaptive,
; so the page scales to the browser while the project size stays 1280x720.
; Threads are off (single-threaded web export). COOP/COEP headers are optional
; until variant/thread_support is turned on — see public/_headers.
; Textures in this project are imported lossless (not VRAM-compressed), so both
; VRAM texture-compression toggles stay off. Turning mobile on makes Godot
; reject the export unless ETC2/ASTC import is enabled.
;
; Extra resource packs (export/packs.json): preset "Web" is the game. Its
; exclude_filter drops directories that ship as separate .pck files, and its
; include_filter keeps export/packs.json in index.pck. Preset "Web Pack" is
; not runnable. scripts/export_web.sh sets RESOURCE_PACK_ROLE to a pack id
; and exports that preset once per pack. The editor plugin
; addons/resource_packs skips files that do not belong in the current role.
; Do not turn Lossy import on just to squeeze index.pck under 100 MiB.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="export/packs.json"
exclude_filter="assets/family/*,addons/resource_packs/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
resource_packs/role="main"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://export/web_shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
threads/emscripten_pool_size=8
threads/godot_pool_size=4

[preset.1]

