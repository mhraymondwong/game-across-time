# Export the Godot 4.7.2 HTML5 build on every push to main.
# The live site is GitHub Pages (.github/workflows/deploy-pages.yml), which
# publishes the committed build/web. This workflow does not update that site.
# Cloudflare Workers/Pages reject a single file over 25 MiB; index.pck and
# index.wasm exceed that, so Cloudflare here stays optional.
# Artifact upload is the scaffold default. Cloudflare deploy runs only when
# both Actions secrets exist, so a missing token does not fail this workflow.
name: Export Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: export-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot 4.7.2 editor and web export template
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/game-across-time/godot-4.7.2
            /home/runner/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-linux-x86_64-web-nothreads-v3

      - name: Install Godot editor shared libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            libdbus-1-3 \
            libfontconfig1 \
            libgl1 \
            libpulse0 \
            libudev1 \
            libx11-6 \
            libxcursor1 \
            libxext6 \
            libxinerama1 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            pngquant \
            unzip
          if ! sudo apt-get install -y --no-install-recommends libasound2t64; then
            sudo apt-get install -y --no-install-recommends libasound2
          fi

      - name: Install Godot 4.7.2 and the web export template
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          RELEASE_TAG="${GODOT_VERSION}-stable"
          BASE_URL="https://github.com/godotengine/godot/releases/download/${RELEASE_TAG}"
          EDITOR_ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          TEMPLATES_TPZ="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # From SHA512-SUMS.txt on the 4.7.2-stable GitHub release.
          EDITOR_SHA512="9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"
          TEMPLATES_SHA512="ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079"

          CACHE_ROOT="${HOME}/.cache/game-across-time/godot-${GODOT_VERSION}"
          EDITOR_BIN="${CACHE_ROOT}/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          TPL="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$CACHE_ROOT" "$TPL"

          download() {
            local url="$1" dest="$2" sum="$3"
            echo "Downloading ${url}"
            curl -fL --retry 5 --retry-delay 2 -o "$dest" "$url"
            echo "${sum}  ${dest}" | sha512sum -c -
          }

          if [[ -f "$EDITOR_BIN" ]]; then
            chmod +x "$EDITOR_BIN"
          fi
          if [[ ! -x "$EDITOR_BIN" ]]; then
            tmp="$(mktemp -d)"
            download "${BASE_URL}/${EDITOR_ZIP}" "${tmp}/${EDITOR_ZIP}" "$EDITOR_SHA512"
            unzip -q "${tmp}/${EDITOR_ZIP}" -d "${tmp}/editor"
            found="$(find "${tmp}/editor" -type f -name "Godot_v${GODOT_VERSION}-stable_linux.x86_64" | head -n 1)"
            if [[ -z "$found" ]]; then
              echo "error: editor binary not found inside ${EDITOR_ZIP}" >&2
              find "${tmp}/editor" -maxdepth 3 -type f >&2
              exit 1
            fi
            install -m 0755 "$found" "$EDITOR_BIN"
            rm -rf "$tmp"
          fi

          # The official templates archive is about 1.2 GB. Only the single-threaded
          # web zips plus ICU text data are installed (variant/thread_support=false).
          # Release export uses web_nothreads_release.zip; Godot also checks
          # web_nothreads_debug.zip because the preset is runnable.
          # icudt_godot.dat keeps Traditional Chinese on the template's text data.
          need_templates=0
          if [[ ! -f "${TPL}/web_nothreads_release.zip" || ! -f "${TPL}/web_nothreads_debug.zip" || ! -f "${TPL}/icudt_godot.dat" ]]; then
            need_templates=1
          fi
          if [[ "$need_templates" -eq 1 ]]; then
            tmp="$(mktemp -d)"
            download "${BASE_URL}/${TEMPLATES_TPZ}" "${tmp}/${TEMPLATES_TPZ}" "$TEMPLATES_SHA512"
            unzip -q "${tmp}/${TEMPLATES_TPZ}" -d "${tmp}/tpl"
            rel="$(find "${tmp}/tpl" -type f -name 'web_nothreads_release.zip' | head -n 1)"
            dbg="$(find "${tmp}/tpl" -type f -name 'web_nothreads_debug.zip' | head -n 1)"
            icu="$(find "${tmp}/tpl" -type f -name 'icudt_godot.dat' | head -n 1)"
            ver="$(find "${tmp}/tpl" -type f -name 'version.txt' | head -n 1)"
            if [[ -z "$rel" || -z "$dbg" || -z "$icu" ]]; then
              echo "error: web nothreads templates or icudt_godot.dat not found in export templates" >&2
              find "${tmp}/tpl" -type f \( -name 'web_*' -o -name 'icudt_godot.dat' \) >&2
              exit 1
            fi
            cp "$rel" "${TPL}/web_nothreads_release.zip"
            cp "$dbg" "${TPL}/web_nothreads_debug.zip"
            cp "$icu" "${TPL}/icudt_godot.dat"
            if [[ -n "$ver" ]]; then
              cp "$ver" "${TPL}/version.txt"
            fi
            rm -rf "$tmp"
          fi

          echo "GODOT_BIN=${EDITOR_BIN}" >> "$GITHUB_ENV"
          "${EDITOR_BIN}" --version

      - name: Export HTML5
        run: bash scripts/export_web.sh

      - name: Upload build/web artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-across-time-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      # Optional publish. Missing CLOUDFLARE_* secrets skip this step (exit 0).
      # Enable later: Settings → Secrets and variables → Actions
      #   CLOUDFLARE_API_TOKEN
      #   CLOUDFLARE_ACCOUNT_ID
      # Hard gate equivalent (not used, so an empty secret cannot fail the job):
      #   if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      - name: Deploy to Cloudflare Workers (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Cloudflare secrets are not configured. Skipping deploy."
            echo "The game-across-time-web artifact is enough for this scaffold."
            echo "See docs/deploy-cloudflare.md when you are ready to publish."
            exit 0
          fi
          # Workers Static Assets, matching wrangler.toml ([assets] directory = build/web).
          npx --yes wrangler@4 deploy
          # Pages alternative — do not run both against the same hostname:
          # npx --yes wrangler@4 pages deploy build/web --project-name game-across-time --commit-dirty=true
