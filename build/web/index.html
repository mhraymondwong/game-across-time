<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#eee1cb">
		<title>《時光裡的她》</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #6d453f;
	background-color: #eee1cb;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: #eee1cb;
	visibility: hidden;
}

#status-fallback {
	position: absolute;
	inset: 0;
	z-index: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	text-align: center;
	pointer-events: none;
}

#status-kicker {
	margin: 0 0 0.85rem;
	font-family: "Songti TC", "PMingLiU", "Noto Serif CJK TC", Palatino, "Palatino Linotype", serif;
	font-size: clamp(14px, 1.7vw, 20px);
	letter-spacing: 0.22em;
	color: #8d5a52;
}

#status-title {
	margin: 0;
	font-family: "Songti TC", "PMingLiU", "Noto Serif CJK TC", Palatino, "Palatino Linotype", serif;
	font-weight: 600;
	font-size: clamp(42px, 7vw, 88px);
	letter-spacing: 0.14em;
	color: #9a5360;
}

#status-splash {
	position: absolute;
	inset: 0;
	z-index: 1;
	max-width: 100%;
	max-height: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	width: 100%;
	height: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-loading {
	position: absolute;
	left: 50%;
	bottom: 6.5%;
	z-index: 2;
	display: none;
	flex-direction: column;
	align-items: center;
	gap: 7px;
	padding: 8px 22px 10px;
	border: 1px solid rgba(168, 93, 107, 0.35);
	border-radius: 999px;
	background: rgba(255, 248, 240, 0.84);
	box-shadow: 0 10px 28px rgba(120, 78, 62, 0.12);
	transform: translateX(-50%);
}

#status-caption {
	margin: 0;
	color: #8d4d58;
	font-family: "Songti TC", "PMingLiU", "Noto Serif CJK TC", Palatino, "Palatino Linotype", serif;
	font-size: 13px;
	letter-spacing: 0.42em;
	text-indent: 0.42em;
	animation: diary-pulse 1.6s ease-in-out infinite;
}

#status-progress {
	display: none;
	width: min(220px, 42vw);
	height: 4px;
	margin: 0;
	overflow: hidden;
	border: 0;
	border-radius: 999px;
	background-color: rgba(141, 77, 88, 0.18);
	accent-color: #a85d6b;
	appearance: none;
	-webkit-appearance: none;
}

#status-progress::-webkit-progress-bar {
	border-radius: 999px;
	background-color: rgba(141, 77, 88, 0.18);
}

#status-progress::-webkit-progress-value {
	border-radius: 999px;
	background-color: #a85d6b;
}

#status-progress::-moz-progress-bar {
	border-radius: 999px;
	background-color: #a85d6b;
}

#status-notice {
	position: relative;
	z-index: 3;
	display: none;
	max-width: 36rem;
	margin: 0 2rem;
	padding: 1rem 1.2rem;
	overflow: hidden;
	border: 1px solid #e2c1bc;
	border-radius: 0.75rem;
	background-color: rgba(255, 248, 241, 0.96);
	box-shadow: 0 12px 32px rgba(120, 78, 62, 0.16);
	color: #6d403c;
	font-family: "Songti TC", "PMingLiU", "Noto Serif CJK TC", Palatino, "Palatino Linotype", sans-serif;
	line-height: 1.45;
	text-align: center;
}

@keyframes diary-pulse {
	0%, 100% { opacity: 0.62; }
	50% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
	#status-caption { animation: none; }
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status" role="status" aria-live="polite">
			<div id="status-fallback" aria-hidden="true">
				<p id="status-kicker">父親與女兒 · 溫馨小鎮</p>
				<h1 id="status-title">時光裡的她</h1>
			</div>
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="時光裡的她">
			<div id="status-loading">
				<p id="status-caption">載入中</p>
				<progress id="status-progress"></progress>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":104392920,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusLoading = document.getElementById('status-loading');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		const showProgress = mode === 'progress';
		statusProgress.style.display = showProgress ? 'block' : 'none';
		if (statusLoading) {
			statusLoading.style.display = showProgress ? 'flex' : 'none';
		}
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run this game in the browser are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
