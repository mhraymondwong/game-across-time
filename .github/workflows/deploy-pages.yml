# Publish the committed Godot 4.7.2 HTML5 export (build/web) to GitHub Pages.
# Live site: https://mhraymondwong.github.io/game-across-time/
# Does not re-export. The directory may contain index.pck plus packs/*.pck
# and packs.json (see export/packs.json). Relative URLs in index.html stay
# under /game-across-time/ because Pages redirects to a trailing slash.
# Cloudflare is not the host (25 MiB per-file limit). GitHub rejects a
# single file of 100 MiB or more; the size check below fails the job first.
name: Deploy Godot web build to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Reject files at or above GitHub's 100 MiB limit
        run: python3 scripts/pack_manifest.py check-sizes build/web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
